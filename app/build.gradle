plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvlauncher"
        // 支持到 Android 4.4（API 19）：兼容小米电视2s 等老盒子
        minSdk 19
        targetSdk 34
        versionCode 24
        versionName "1.5.1"
    }

    // 固定签名：保证任何机器构建的 APK 签名一致，可直接覆盖安装（adb install -r）。
    // 显式启用 v1 签名：Android 5.x/6.x 的老盒子只校验 v1（JAR）签名，
    // 未启用时这些设备上会报"INSTALL_PARSE_FAILED_NO_CERTIFICATES"无法安装。
    signingConfigs {
        launcher {
            storeFile file('tvlauncher.keystore')
            storePassword 'tvlauncher123'
            keyAlias 'tvlauncher'
            keyPassword 'tvlauncher123'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.launcher
        }
        release {
            signingConfig signingConfigs.launcher
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 统一 APK 输出文件名：tvLauncher-v{版本号}-{构建类型}.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "tvLauncher-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // 仅依赖 RecyclerView，保持 APK 精简，适合 TV 设备
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
